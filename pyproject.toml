[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precos-avicultura"
version = "0.1.0"
description = "Forecasting Brazilian broiler prices from feed-cost, FX and inflation drivers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nicollas Camargo" }]
keywords = ["time-series", "forecasting", "agribusiness", "mlops"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "ruff>=0.3",
]
stats = ["statsmodels>=0.14"]
notebook = ["jupyter>=1.0", "matplotlib>=3.7"]

[project.scripts]
precos-avicultura = "precos_avicultura.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
